name: All-in-One Multi-Format Blocklist Builder

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go & Python
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Check for Upstream HaGeZi Updates
        id: check_update
        run: |
          LATEST_SHA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/hagezi/dns-blocklists/commits/main" | jq -r .sha)
          
          echo "Latest Upstream SHA: $LATEST_SHA"

          if [ -z "$LATEST_SHA" ] || [ "$LATEST_SHA" == "null" ]; then
            echo "Error: Failed to fetch latest commit from GitHub API."
            exit 1
          fi

          SAVED_SHA=$(curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/release/last_sha.txt" || true)
          echo "Locally Stored SHA:  $SAVED_SHA"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$LATEST_SHA" != "$SAVED_SHA" ]; then
            echo "EXECUTE_BUILD=true" >> $GITHUB_OUTPUT
            echo "NEW_SHA=$LATEST_SHA" >> $GITHUB_OUTPUT
            echo "Build condition met. Proceeding..."
          else
            echo "EXECUTE_BUILD=false" >> $GITHUB_OUTPUT
            echo "No changes detected. Exiting..."
          fi

      - name: Install Mihomo, Sing-box & Xray DAT Compiler
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          # 1. Download Mihomo Core
          echo "Downloading Mihomo..."
          MIHOMO_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux-amd64-compatible.*\\.gz$")) | .browser_download_url' | head -n 1)
          curl -sL "$MIHOMO_URL" -o mihomo.gz && gzip -d mihomo.gz && chmod +x mihomo

          # 2. Download Sing-box Core
          echo "Downloading Sing-box..."
          SINGBOX_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux-amd64\\.tar\\.gz$")) | .browser_download_url' | head -n 1)
          curl -sL "$SINGBOX_URL" -o singbox.tar.gz
          tar -xzf singbox.tar.gz --strip-components=1 -C .
          chmod +x sing-box

          # 3. Setup V2Ray/Xray geosite dat generator
          git clone --depth=1 https://github.com/v2fly/domain-list-community.git compiler-geosite
          git clone --depth=1 https://github.com/v2fly/geoip.git compiler-geoip

      - name: Fetch and Compile Domain Lists
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          mkdir -p output/mrs output/srs output/json output/list output/raw output/yaml
          mkdir -p compiler-geosite/data

          declare -A DOMAIN_LISTS=(
            ["HageziLight"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/light-onlydomains.txt"
            ["HageziNormal"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/multi-onlydomains.txt"
            ["HageziPro"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt"
            ["HageziProPlus"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.plus-onlydomains.txt"
            ["HageziUltimate"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/ultimate-onlydomains.txt"
            ["HageziProMini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.mini-onlydomains.txt"
            ["HageziProPlusMini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.plus.mini-onlydomains.txt"
            ["HageziUltimateMini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/ultimate.mini-onlydomains.txt"
            ["HageziTIF"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif-onlydomains.txt"
            ["HageziTIFMedium"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.medium-onlydomains.txt"
            ["HageziTIFMini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.mini-onlydomains.txt"
            ["HageziFake"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/fake-onlydomains.txt"
            ["HageziPopUpAds"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/popupads-onlydomains.txt"
            ["HageziDynDNS"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/dyndns-onlydomains.txt"
            ["HageziBadwareHoster"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/hoster-onlydomains.txt"
            ["HageziSpamTLDs"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/spam-tlds-onlydomains.txt"
            ["HageziBypassAll"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/doh-vpn-proxy-bypass-onlydomains.txt"
            ["HageziBypassDoH"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/doh-onlydomains.txt"
            ["HageziURLShortener"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/urlshortener-onlydomains.txt"
            ["HageziAntiPiracy"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/anti.piracy-onlydomains.txt"
            ["HageziSocial"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/social-onlydomains.txt"
            ["HageziNSFW"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/nsfw-onlydomains.txt"
            ["HageziGambling"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/gambling-onlydomains.txt"
            ["HageziNativeAmazon"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.amazon-onlydomains.txt"
            ["HageziNativeApple"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.apple-onlydomains.txt"
            ["HageziNativeMicrosoft"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.winoffice-onlydomains.txt"
            ["HageziNativeSamsung"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.samsung-onlydomains.txt"
            ["HageziNativeTikTok"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.tiktok-onlydomains.txt"
          )

          for NAME in "${!DOMAIN_LISTS[@]}"; do
            URL="${DOMAIN_LISTS[$NAME]}"
            LOWER_NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]')
            echo "===> Processing DOMAIN list: $NAME"

            # 1. Raw Clean Domains
            curl -sSL -f "$URL" \
              | grep -v '^#' \
              | grep -v '^[[:space:]]*$' \
              | sed -E 's/^(\*\.|\.)+//' \
              | tr -d '\r' > "output/raw/${NAME}.txt"

            # 2. Xray / V2Ray Data prep (v2fly format)
            cp "output/raw/${NAME}.txt" "compiler-geosite/data/${LOWER_NAME}"

            # 3. Mihomo Ruleset (.mrs)
            sed 's/^/+./' "output/raw/${NAME}.txt" > temp_mihomo.txt
            ./mihomo convert-ruleset domain text temp_mihomo.txt "output/mrs/${NAME}.mrs"

            # 4. Classical List (.list for Surge, Shadowrocket, Stash)
            sed 's/^/DOMAIN-SUFFIX,/' "output/raw/${NAME}.txt" > "output/list/${NAME}.list"

            # 5. Clash YAML format
            echo "payload:" > "output/yaml/${NAME}.yaml"
            sed 's/^/  - "+./; s/$/"/' "output/raw/${NAME}.txt" >> "output/yaml/${NAME}.yaml"

            # 6. Sing-box Rule-set (.json & .srs)
            jq -R . "output/raw/${NAME}.txt" | jq -s --arg name "$NAME" '{"version": 1, "rules": [{"domain_suffix": .}]}' > "output/json/${NAME}.json"
            ./sing-box rule-set compile "output/json/${NAME}.json" -o "output/srs/${NAME}.srs"

            rm -f temp_mihomo.txt
          done

          # Build geosite.dat for Xray/V2Ray
          echo "Compiling all domains into hagezi-geosite.dat for Xray..."
          cd compiler-geosite
          go run ./ --datapath=./data --outputname=../output/hagezi-geosite.dat
          cd ..

      - name: Fetch and Compile IP-CIDR Lists
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          mkdir -p compiler-geoip/data

          declare -A IP_LISTS=(
            ["HageziTIF_IP"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/ips/tif.txt"
            ["HageziDoH_IP"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/ips/doh.txt"
          )

          for NAME in "${!IP_LISTS[@]}"; do
            URL="${IP_LISTS[$NAME]}"
            LOWER_NAME=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/_ip//')
            echo "===> Processing IP list: $NAME"

            # 1. Raw Clean IPs with CIDR
            curl -sSL -f "$URL" \
              | grep -v '^#' \
              | grep -v '^[[:space:]]*$' \
              | sed -E 's|^([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$|\1/32|' \
              | tr -d '\r' > "output/raw/${NAME}.txt"

            # 2. Xray GeoIP prep
            cp "output/raw/${NAME}.txt" "compiler-geoip/data/${LOWER_NAME}"

            # 3. Mihomo Ruleset (.mrs)
            ./mihomo convert-ruleset ipcidr text "output/raw/${NAME}.txt" "output/mrs/${NAME}.mrs"

            # 4. Classical List (.list)
            sed 's/^/IP-CIDR,/' "output/raw/${NAME}.txt" > "output/list/${NAME}.list"

            # 5. Clash YAML format
            echo "payload:" > "output/yaml/${NAME}.yaml"
            sed 's/^/  - "/; s/$/"/' "output/raw/${NAME}.txt" >> "output/yaml/${NAME}.yaml"

            # 6. Sing-box Rule-set (.json & .srs)
            jq -R . "output/raw/${NAME}.txt" | jq -s '{"version": 1, "rules": [{"ip_cidr": .}]}' > "output/json/${NAME}.json"
            ./sing-box rule-set compile "output/json/${NAME}.json" -o "output/srs/${NAME}.srs"
          done

          # Build geoip.dat for Xray/V2Ray
          echo "Compiling IPs into hagezi-geoip.dat for Xray..."
          cd compiler-geoip
          go run ./ --datapath=./data --outputname=../output/hagezi-geoip.dat
          cd ..

          # Copy everything from subfolders to root of output for flat access as well
          cp output/mrs/*.mrs output/ 2>/dev/null || true
          cp output/srs/*.srs output/ 2>/dev/null || true

          echo "${{ steps.check_update.outputs.NEW_SHA }}" > output/last_sha.txt

      - name: Deploy All Formats to Release Branch
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./output
          destination_dir: ./
          keep_files: false

      - name: Update Rolling GitHub Release
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="latest"
          RELEASE_TITLE="HaGeZi Multi-Client Ruleset Suite (Latest)"
          RELEASE_NOTES="Automated build for Mihomo, Sing-box, Xray, Surge, Shadowrocket | Upstream SHA: ${{ steps.check_update.outputs.NEW_SHA }} | Built: $(date -u +'%Y-%m-%d %H:%M UTC')"

          echo "Packaging archive of all formats..."
          tar -czf output/all-rulesets.tar.gz -C output .

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" output/*.dat output/*.mrs output/*.srs output/all-rulesets.tar.gz --clobber
          else
            gh release create "$RELEASE_TAG" output/*.dat output/*.mrs output/*.srs output/all-rulesets.tar.gz \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi

      - name: Purge jsDelivr CDN Cache
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          sleep 5
          for FILE in output/mrs/*.mrs output/srs/*.srs output/*.dat; do
            [ -e "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/$FILENAME" >/dev/null || true
          done-sSL -f "$URL" \
              | grep -v '^#' \
              | grep -v '^[[:space:]]*$' \
              | sed -E 's|^([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$|\1/32|' > temp_ip.txt

            ./mihomo convert-ruleset ipcidr text temp_ip.txt "output/${NAME}.mrs"
            
            FILE_SIZE=$(wc -c < "output/${NAME}.mrs")
            echo "Generated $NAME.mrs ($FILE_SIZE bytes)"
            rm -f temp_ip.txt
          done

          # Save the latest processed commit SHA to include in the release artifacts
          echo "${{ steps.check_update.outputs.NEW_SHA }}" > output/last_sha.txt
          rm -f mihomo

      - name: Deploy MRS Artifacts to Release Branch
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./output
          destination_dir: ./
          keep_files: false

      - name: Update Rolling GitHub Release
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="latest"
          RELEASE_TITLE="HaGeZi Ruleset Suite (Latest Build)"
          RELEASE_NOTES="Automated rolling build. Upstream commit: ${{ steps.check_update.outputs.NEW_SHA }} | Built on: $(date -u +'%Y-%m-%d %H:%M UTC')"

          echo "Checking whether release '$RELEASE_TAG' already exists..."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release exists. Updating metadata and overwriting assets..."
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
            gh release upload "$RELEASE_TAG" output/* --clobber
          else
            echo "Release does not exist. Creating fresh '$RELEASE_TAG' release..."
            gh release create "$RELEASE_TAG" output/* \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi

      - name: Purge jsDelivr CDN Cache
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          echo "Waiting 5 seconds for commit propagation on jsDelivr CDN..."
          sleep 5
          for FILE in output/*.mrs; do
            [ -e "$FILE" ] || continue
            FILENAME=$(basename "$FILE")
            echo "Purging CDN cache for $FILENAME..."
            STATUS=$(curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/$FILENAME" | jq -r .status || true)
            echo "Purge status: $STATUS"
          done
