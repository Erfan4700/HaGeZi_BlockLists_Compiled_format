name: HaGeZi to MRS Automated Builder

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for Upstream HaGeZi Updates
        id: check_update
        run: |
          LATEST_SHA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/hagezi/dns-blocklists/commits/main" | jq -r .sha)
          
          echo "Latest Upstream SHA: $LATEST_SHA"

          if [ -z "$LATEST_SHA" ] || [ "$LATEST_SHA" == "null" ]; then
            echo "Error: Failed to fetch latest commit from GitHub API."
            exit 1
          fi

          SAVED_SHA=$(curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/release/last_sha.txt" || true)
          echo "Locally Stored SHA:  $SAVED_SHA"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$LATEST_SHA" != "$SAVED_SHA" ]; then
            echo "EXECUTE_BUILD=true" >> $GITHUB_OUTPUT
            echo "NEW_SHA=$LATEST_SHA" >> $GITHUB_OUTPUT
            echo "Build condition met (Manual trigger or upstream update). Triggering build..."
          else
            echo "EXECUTE_BUILD=false" >> $GITHUB_OUTPUT
            echo "No changes detected. Exiting cleanly..."
          fi

      - name: Download Mihomo Core
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          echo "Downloading latest Mihomo core..."
          MIHOMO_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url.*linux-amd64-compatible.*\.gz\"" | head -n 1 | cut -d '"' -f 4)
          curl -sL "$MIHOMO_URL" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo

      - name: Fetch and Compile Domain Lists
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          mkdir -p output

          declare -A DOMAIN_LISTS=(
            ["HageziLight"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/light-onlydomains.txt"
            ["HageziNormal"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/multi-onlydomains.txt"
            ["HageziPro"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt"
            ["HageziProPlus"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.plus-onlydomains.txt"
            ["HageziUltimate"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/ultimate-onlydomains.txt"

            ["HageziProMini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.mini-onlydomains.txt"
            ["HageziProPlusMini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.plus.mini-onlydomains.txt"
            ["HageziUltimateMini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/ultimate.mini-onlydomains.txt"

            ["HageziTIF"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif-onlydomains.txt"
            ["HageziTIFMedium"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.medium-onlydomains.txt"
            ["HageziTIFMini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.mini-onlydomains.txt"
            ["HageziFake"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/fake-onlydomains.txt"
            ["HageziPopUpAds"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/popupads-onlydomains.txt"
            ["HageziDynDNS"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/dyndns-onlydomains.txt"
            ["HageziBadwareHoster"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/hoster-onlydomains.txt"
            ["HageziSpamTLDs"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/spam-tlds-onlydomains.txt"
            ["HageziSpamTLDsAllow"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/spam-tlds-allow-onlydomains.txt"

            ["HageziBypassAll"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/doh-vpn-proxy-bypass-onlydomains.txt"
            ["HageziBypassDoH"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/doh-onlydomains.txt"

            ["HageziURLShortener"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/urlshortener-onlydomains.txt"
            ["HageziAntiPiracy"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/anti.piracy-onlydomains.txt"
            ["HageziSocial"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/social-onlydomains.txt"
            ["HageziNSFW"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/nsfw-onlydomains.txt"
            ["HageziNoSafeSearch"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/nosafesearch-onlydomains.txt"
            ["HageziGambling"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/gambling-onlydomains.txt"
            ["HageziGamblingMedium"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/gambling.medium-onlydomains.txt"
            ["HageziGamblingMini"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/gambling.mini-onlydomains.txt"

            ["HageziNativeAmazon"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.amazon-onlydomains.txt"
            ["HageziNativeApple"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.apple-onlydomains.txt"
            ["HageziNativeHuawei"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.huawei-onlydomains.txt"
            ["HageziNativeMicrosoft"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.winoffice-onlydomains.txt"
            ["HageziNativeSamsung"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.samsung-onlydomains.txt"
            ["HageziNativeTikTok"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.tiktok-onlydomains.txt"
            ["HageziNativeTikTokExtended"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.tiktok.extended-onlydomains.txt"
            ["HageziNativeLGWebOS"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.lgwebos-onlydomains.txt"
            ["HageziNativeRoku"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.roku-onlydomains.txt"
            ["HageziNativeVivo"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.vivo-onlydomains.txt"
            ["HageziNativeOppoRealme"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.oppo-realme-onlydomains.txt"
            ["HageziNativeXiaomi"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.xiaomi-onlydomains.txt"

            ["HageziDGA7"]="https://raw.githubusercontent.com/hagezi/nrd/main/domains/dga7.txt"
            ["HageziDGA14"]="https://raw.githubusercontent.com/hagezi/nrd/main/domains/dga14.txt"
            ["HageziDGA30"]="https://raw.githubusercontent.com/hagezi/nrd/main/domains/dga30.txt"
          )

          for NAME in "${!DOMAIN_LISTS[@]}"; do
            URL="${DOMAIN_LISTS[$NAME]}"
            echo "Processing DOMAIN list: $NAME from $URL..."
            
            curl -sSL -f "$URL" \
              | grep -v '^#' \
              | grep -v '^[[:space:]]*$' \
              | sed -E 's/^(\*\.|\.)+//' \
              | sed 's/^/+./' > temp_domain.txt

            ./mihomo convert-ruleset domain text temp_domain.txt "output/${NAME}.mrs"
            
            FILE_SIZE=$(wc -c < "output/${NAME}.mrs")
            echo "Generated $NAME.mrs ($FILE_SIZE bytes)"
            rm -f temp_domain.txt
          done

      - name: Fetch and Compile IP-CIDR Lists
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          declare -A IP_LISTS=(
            ["HageziTIF_IP"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/ips/tif.txt"
            ["HageziDoH_IP"]="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/ips/doh.txt"
          )

          for NAME in "${!IP_LISTS[@]}"; do
            URL="${IP_LISTS[$NAME]}"
            echo "Processing IP-CIDR list: $NAME from $URL..."
            
            curl -sSL -f "$URL" \
              | grep -v '^#' \
              | grep -v '^[[:space:]]*$' \
              | sed -E 's|^([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$|\1/32|' > temp_ip.txt

            ./mihomo convert-ruleset ipcidr text temp_ip.txt "output/${NAME}.mrs"
            
            FILE_SIZE=$(wc -c < "output/${NAME}.mrs")
            echo "Generated $NAME.mrs ($FILE_SIZE bytes)"
            rm -f temp_ip.txt
          done

          echo "${{ steps.check_update.outputs.NEW_SHA }}" > output/last_sha.txt
          rm -f mihomo

      - name: Deploy MRS Artifacts to Release Branch
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./output
          destination_dir: ./
          keep_files: false

      - name: Create Official GitHub Release
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v$(date -u +'%Y.%m.%d-%H%M')"
          RELEASE_TITLE="HaGeZi Ruleset Suite Update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          RELEASE_NOTES="Automated ruleset build including all Multi Tiers, TIF, IP lists, DGAs, and Native Trackers."

          echo "Publishing GitHub Release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" output/*.mrs output/last_sha.txt \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Purge jsDelivr CDN Cache
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          echo "Waiting 5 seconds for commit propagation on jsDelivr CDN..."
          sleep 5
          for FILE in output/*.mrs; do
            FILENAME=$(basename "$FILE")
            echo "Purging CDN cache for $FILENAME..."
            STATUS=$(curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/$FILENAME" | jq -r .status || true)
            echo "Purge status: $STATUS"
          done
