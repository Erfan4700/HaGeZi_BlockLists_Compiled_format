name: HaGeZi to MRS Automated Builder

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for Upstream HaGeZi Updates
        id: check_update
        run: |
          LATEST_SHA=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/hagezi/dns-blocklists/commits/main" | jq -r .sha)
          
          echo "Latest Upstream SHA: $LATEST_SHA"

          if [ -z "$LATEST_SHA" ] || [ "$LATEST_SHA" == "null" ]; then
            echo "Error: Failed to fetch latest commit from GitHub API."
            exit 1
          fi

          SAVED_SHA=$(curl -sL "https://raw.githubusercontent.com/${{ github.repository }}/release/last_sha.txt" || true)
          echo "Locally Stored SHA:  $SAVED_SHA"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "$LATEST_SHA" != "$SAVED_SHA" ]; then
            echo "EXECUTE_BUILD=true" >> $GITHUB_OUTPUT
            echo "NEW_SHA=$LATEST_SHA" >> $GITHUB_OUTPUT
            echo "Build condition met (Manual trigger or upstream update). Triggering build..."
          else
            echo "EXECUTE_BUILD=false" >> $GITHUB_OUTPUT
            echo "No changes detected. Exiting cleanly..."
          fi

      - name: Download Mihomo Core
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          echo "Downloading latest Mihomo core..."
          MIHOMO_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url.*linux-amd64-compatible.*\.gz\"" | head -n 1 | cut -d '"' -f 4)
          curl -sL "$MIHOMO_URL" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo

      - name: Fetch Blocklists and Convert to MRS
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          mkdir -p output

          # تنظیم آدرس‌های دقیق و یکپارچه فقط‌دامنه از مخزن هاگزی
          declare -A TIERS=(
            ["HageziLight"]="wildcard/light-onlydomains.txt"
            ["HageziNormal"]="wildcard/multi-onlydomains.txt"
            ["HageziPro"]="wildcard/pro-onlydomains.txt"
            ["HageziProPlus"]="wildcard/pro.plus-onlydomains.txt"
            ["HageziUltimate"]="wildcard/ultimate-onlydomains.txt"
            ["HageziTIF"]="wildcard/tif-onlydomains.txt"
            ["HageziGambling"]="wildcard/gambling-onlydomains.txt"
            ["HageziNSFW"]="wildcard/nsfw-onlydomains.txt"
            ["HageziDynDNS"]="wildcard/dyndns.txt"
            ["HageziWindows"]="wildcard/native.winoffice-onlydomains.txt"
            ["HageziApple"]="wildcard/native.apple-onlydomains.txt"
            ["HageziXiaomi"]="wildcard/native.xiaomi-onlydomains.txt"
            ["HageziAndroid"]="wildcard/native.samsung-onlydomains.txt"
          )

          for NAME in "${!TIERS[@]}"; do
            SRC_PATH="${TIERS[$NAME]}"
            echo "Processing $NAME from $SRC_PATH..."
            
            curl -sSL -f "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/$SRC_PATH" \
              | grep -v '^#' \
              | grep -v '^[[:space:]]*$' \
              | sed -E 's/^(\*\.|\.)+//' \
              | sed 's/^/+./' > temp_list.txt

            ./mihomo convert-ruleset domain text temp_list.txt "output/${NAME}.mrs"
            
            FILE_SIZE=$(wc -c < "output/${NAME}.mrs")
            echo "Generated $NAME.mrs size: $FILE_SIZE bytes"
            
            if [ "$FILE_SIZE" -lt 500 ]; then
              echo "Error: $NAME.mrs is too small ($FILE_SIZE bytes)!"
              exit 1
            fi
            
            rm -f temp_list.txt
          done

          echo "${{ steps.check_update.outputs.NEW_SHA }}" > output/last_sha.txt
          rm -f mihomo

      - name: Deploy MRS Artifacts to Release Branch
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./output
          destination_dir: ./
          keep_files: false

      - name: Create Official GitHub Release
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v$(date -u +'%Y.%m.%d-%H%M')"
          RELEASE_TITLE="HaGeZi Ruleset Suite Update ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          RELEASE_NOTES="Automated ruleset build including Tiers, TIF, Native Hardware Trackers, DynDNS, and Safety Filters."

          echo "Publishing GitHub Release: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" output/*.mrs output/last_sha.txt \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Purge jsDelivr CDN Cache
        if: steps.check_update.outputs.EXECUTE_BUILD == 'true'
        run: |
          echo "Waiting 5 seconds for commit propagation on jsDelivr CDN..."
          sleep 5
          for NAME in HageziLight HageziNormal HageziPro HageziProPlus HageziUltimate HageziTIF HageziGambling HageziNSFW HageziDynDNS HageziWindows HageziApple HageziXiaomi HageziAndroid; do
            echo "Purging CDN cache for ${NAME}.mrs..."
            STATUS=$(curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${NAME}.mrs" | jq -r .status)
            echo "Purge status: $STATUS"
          done
